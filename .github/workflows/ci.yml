name: CI

on:
  push:
    branches: [master, development]
    paths:
      - "expo-app/**"
      - "nextjs-api/**"
      - ".github/**"
  pull_request:
    branches: [master, development]
    paths:
      - "expo-app/**"
      - "nextjs-api/**"
      - ".github/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-app:
    name: Expo App - Lint e Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - name: Instalar dependências
        uses: bahmutov/npm-install@v1
        with:
          working-directory: expo-app

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Não bloqueia enquanto as pendências conhecidas do expo-doctor (AGENTS.md, FE-23) existirem.
      - name: Expo Doctor (não bloqueante)
        continue-on-error: true
        run: npx expo-doctor

  nextjs-api:
    name: Next.js API - Lint, Typecheck e Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs-api/package-lock.json

      - name: Instalar dependências
        uses: bahmutov/npm-install@v1
        with:
          working-directory: nextjs-api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Sem testes automatizados ainda (pendência 2): quando houver framework aprovado, entram aqui como etapa obrigatória.
      - name: Build Next.js
        run: npm run build
